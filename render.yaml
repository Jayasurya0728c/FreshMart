services:
  # -------------------------------------------------------------
  # 1. Backend: Django REST Framework Web Service
  # -------------------------------------------------------------
  - type: web
    name: freshmart-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "bash ./build.sh"
    startCommand: "gunicorn core.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"

  # -------------------------------------------------------------
  # 2. Frontend: React 19 + Vite Static Site
  # -------------------------------------------------------------
  - type: web
    name: freshmart-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: freshmart-backend
          property: host
